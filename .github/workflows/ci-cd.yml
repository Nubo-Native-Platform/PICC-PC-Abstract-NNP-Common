name: Build & Publish CI/CD

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven POM
        run: mvn validate

      - name: Build Project
        run: mvn clean package -DskipTests

  publish:
    name: Publish public Maven repo (GitHub Pages)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check tag matches POM version
        run: |
          POM_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "POM version: $POM_VERSION, tag: $GITHUB_REF_NAME"
          [ "v$POM_VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag and pom version differ"; exit 1; }

      - name: Prepare gh-pages worktree
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages:gh-pages
            git worktree add ../site gh-pages
          else
            git worktree add --detach ../site
            cd ../site
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null
          fi

      - name: Deploy into the gh-pages folder
        run: |
          SITE="$(realpath ..)/site"
          mkdir -p "$SITE/maven"
          mvn -B clean deploy -DskipTests \
            -DaltDeploymentRepository=pages::file://$SITE/maven

      - name: Push gh-pages
        run: |
          cd ../site
          touch .nojekyll
          git add -A
          git commit -m "Publish ${GITHUB_REF_NAME}" || echo "Nothing to commit"
          git push origin gh-pages
